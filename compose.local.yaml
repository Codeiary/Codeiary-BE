name: codeiary-local-storage

services:
  s3:
    image: adobe/s3mock:5.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: codeiary-local
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - images:/s3mockroot

volumes:
  images:

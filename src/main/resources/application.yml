spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-secret}
            scope: openid,profile,email

server:
  forward-headers-strategy: framework
  shutdown: graceful

oauth2:
  redirect-home: ${OAUTH2_REDIRECT_HOME:http://localhost:5173/auth/callback}

cloud:
  aws:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      access-key: ${AWS_ACCESS_KEY_ID:}
      secret-key: ${AWS_SECRET_ACCESS_KEY:}
      bucket: ${MEDIA_S3_BUCKET:}
      public-base-url: ${MEDIA_PUBLIC_BASE_URL:}

token:
  jwt:
    secret: ${TOKEN_JWT_SECRET:${JWT_SECRET:}}
    issuer: codeiary
    audience: codeiary-api
    access-token-ttl: 30m
    refresh-token-ttl: 7d
  cookie:
    access-name: access_token
    refresh-name: refresh_token
    domain: ${TOKEN_COOKIE_DOMAIN:}
    path: /
    secure: ${TOKEN_COOKIE_SECURE:false}
    http-only: true
    same-site: ${TOKEN_COOKIE_SAME_SITE:Strict}
    access-max-age: 30m
    refresh-max-age: 7d

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

spring:
  data:
    redis:
      cluster:
        nodes: ${VALKEY_ENDPOINT}
      ssl:
        enabled: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_CALLBACK_URL:https://api.codeiary.com/login/oauth2/code/github}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  server:
    port: 9091

token:
  cookie:
    secure: ${TOKEN_COOKIE_SECURE:true}
    same-site: ${TOKEN_COOKIE_SAME_SITE:Strict}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://codeiary.com}

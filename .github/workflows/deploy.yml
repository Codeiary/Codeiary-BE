name: Build and deploy Codeiary API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codeiary-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: codeiary-api

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EC2_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Check immutable commit image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" > /tmp/codeiary-image.json 2> /tmp/codeiary-image-error.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException /tmp/codeiary-image-error.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/codeiary-image-error.txt >&2
            exit 1
          fi
      - name: Build and push ARM64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_SSM_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" \
            --document-name CodeiaryDeployApi \
            --comment "Deploy Codeiary API $GITHUB_SHA" \
            --parameters "imageTag=$GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command_id=$command_id"
          for attempt in $(seq 1 100); do
            status=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo "Deployment succeeded: $GITHUB_SHA"; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed: $status, command_id=$command_id" >&2
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Deployment wait timed out: $command_id" >&2
          exit 1

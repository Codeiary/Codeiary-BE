name: Build and deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: public.ecr.aws
  REGISTRY_ALIAS: c6w0t5f3
  IMAGE_NAME: codeiary-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_ALIAS }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_ALIAS}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --region "${{ vars.AWS_REGION }}" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Codeiary API ${GITHUB_SHA}" \
            --parameters commands="[
              \"set -eu\",
              \"cd /opt/codeiary\",
              \"sed -i 's|^IMAGE=.*|IMAGE=${IMAGE}|' .env\",
              \"docker compose pull api\",
              \"docker compose up -d --remove-orphans\",
              \"docker image prune -f\"
            ]" --query 'Command.CommandId' --output text)
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"; exit 1 ;;
            esac
            sleep 10
          done
          echo "SSM command $COMMAND_ID did not finish within 10 minutes" >&2
          exit 1

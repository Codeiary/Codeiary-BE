AWSTemplateFormatVersion: "2010-09-09"
Description: Codeiary GitHub OIDC deployment roles and frontend artifact bucket

Parameters:
  GitHubOidcProviderArn:
    Type: String
  FrontendRepository:
    Type: String
    Description: owner/repository
  BackendRepository:
    Type: String
    Description: owner/repository
  ManagedInstanceId:
    Type: String
    Description: SSM managed node ID, usually mi-...

Resources:
  FrontendArtifacts:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldReleases
            Status: Enabled
            ExpirationInDays: 14
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: codeiary-frontend-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${FrontendRepository}:*"
      Policies:
        - PolicyName: deploy-frontend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FrontendArtifacts.Arn
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
                Resource: !Sub "${FrontendArtifacts.Arn}/*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:managed-instance/${ManagedInstanceId}"
              - Effect: Allow
                Action: ["ssm:GetCommandInvocation", "ssm:ListCommandInvocations"]
                Resource: "*"

  BackendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: codeiary-backend-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${BackendRepository}:*"
      Policies:
        - PolicyName: deploy-backend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:managed-instance/${ManagedInstanceId}"
              - Effect: Allow
                Action: ["ssm:GetCommandInvocation", "ssm:ListCommandInvocations"]
                Resource: "*"

  ManagedNodeArtifactPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: codeiary-managed-node-artifacts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt FrontendArtifacts.Arn
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "${FrontendArtifacts.Arn}/*"

Outputs:
  FrontendDeployRoleArn:
    Value: !GetAtt FrontendDeployRole.Arn
  BackendDeployRoleArn:
    Value: !GetAtt BackendDeployRole.Arn
  FrontendDeployBucket:
    Value: !Ref FrontendArtifacts
  ManagedNodeArtifactPolicyArn:
    Value: !Ref ManagedNodeArtifactPolicy

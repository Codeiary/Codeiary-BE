plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'eclipse'
}

group = 'com.codeiary'
version = '0.0.1-SNAPSHOT'
description = 'codeiary'

ext {
    mapstructVersion = '1.6.3'
    querydslVersion = '7.7'
    springdocVersion = '3.1.1'
    jjwtVersion = '0.13.0'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
    testAnnotationProcessor.extendsFrom annotationProcessor
}

repositories {
	mavenCentral()
}

dependencies {

	// Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Junit
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'


    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-gson:${jjwtVersion}"

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // QueryDSL (OpenFeign fork, Jakarta JPA)
    implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // OpenAPI / Swagger UI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (!options.compilerArgs.contains('-parameters')) {
        options.compilerArgs.add('-parameters')
    }
}

tasks.register('eclipsePreferences') {
    def settings = layout.projectDirectory.dir('.settings')
    outputs.files(settings.file('org.eclipse.core.resources.prefs'), settings.file('org.eclipse.jdt.apt.core.prefs'))
    doLast {
        def update = { String name, Map<String, String> values ->
            def preferences = settings.file(name).asFile
            def properties = new Properties()
            if (preferences.exists()) {
                preferences.withInputStream { properties.load(it) }
            }
            properties.setProperty('eclipse.preferences.version', '1')
            values.each { key, value -> properties.setProperty(key, value) }
            preferences.parentFile.mkdirs()
            preferences.withOutputStream { properties.store(it, null) }
        }
        update('org.eclipse.core.resources.prefs', ['encoding/<project>': 'UTF-8'])
        update('org.eclipse.jdt.apt.core.prefs', [
            'org.eclipse.jdt.apt.aptEnabled': 'false',
            'org.eclipse.jdt.apt.reconcileEnabled': 'false',
            'org.eclipse.jdt.apt.genSrcDir': 'build/generated/sources/annotationProcessor/java/main',
            'org.eclipse.jdt.apt.genTestSrcDir': 'build/generated/sources/annotationProcessor/java/test'
        ])
    }
}

eclipse {
    synchronizationTasks 'compileJava', 'compileTestJava', 'eclipseJdt', 'eclipsePreferences'
    autoBuildTasks 'compileJava', 'compileTestJava'
    jdt {
        // Annotation processing runs in Gradle; STS compiles its generated sources.
        file.withProperties { properties ->
            properties.setProperty('org.eclipse.jdt.core.compiler.processAnnotations', 'disabled')
            properties.setProperty('org.eclipse.jdt.core.compiler.codegen.methodParameters', 'generate')
        }
    }
    classpath.file.whenMerged { classpath ->
        def generated = [
            'build/generated/sources/annotationProcessor/java/main': 'main',
            'build/generated/sources/annotationProcessor/java/test': 'test'
        ]
        classpath.entries.removeAll { entry ->
            entry.kind == 'src' && (entry.path in generated.keySet() || entry.path in [
                'bin/generated-sources/annotations', 'bin/generated-test-sources/annotations'
            ])
        }
        generated.each { path, scope ->
            def entry = new org.gradle.plugins.ide.eclipse.model.SourceFolder(path, "bin/${scope}")
            entry.entryAttributes['ignore_optional_problems'] = 'true'
            entry.entryAttributes['gradle_scope'] = scope
            entry.entryAttributes['gradle_used_by_scope'] = scope == 'main' ? 'main,test' : 'test'
            if (scope == 'test') {
                entry.entryAttributes['test'] = 'true'
            }
            classpath.entries.add(entry)
        }
    }
}

tasks.named('eclipseClasspath') {
    dependsOn 'compileJava', 'compileTestJava', 'eclipsePreferences'
}

tasks.named('bootTestRun') {
    mainClass = 'com.codeiary.TestCodeiaryBeApplication'
    args '--spring.profiles.active=test'
}
